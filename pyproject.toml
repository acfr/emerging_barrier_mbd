[project]
name = "diffusion_trajopt"
version = "0.1.0"
description = ""
authors = [{ name = "Raghav Mishra", email = "raghav.mishra@sydney.edu.au" }]
requires-python = ">=3.12,<4.0"
readme = "README.md"
dependencies = [
    "jax[cuda12]==0.5",
    "flax>0.9.0",
    "matplotlib>=3.9.2,<4",
    "mujoco>=3.3.3",
    "mujoco-mjx>=3.3.3",
    "jupyterlab>4.2.5",
    "tqdm>4.66.5",
    "cvxopt>=1.3.2,<2",
    "equinox>=0.12.2,<0.13",
    "seaborn>=0.13.2,<0.14",
    "jax-cosmo==0.1.0",
    "interpax>=0.3.9,<0.4",
    "scienceplots>=2.1.1,<3",
    "jax-tqdm>=0.4.0,<0.5",
    "kitcat>=1.2.1,<2",
    "matplotloom>=0.9.1,<0.10",
]

[project.optional-dependencies]
reach = [
    "reach-mjx",
]

[dependency-groups]
reach = ["reach-mjx"]

[tool.uv]
default-groups = ["reach"]

[tool.uv.sources]
reach-mjx = { path = "../reach-mjx" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diffusion_trajopt"]
